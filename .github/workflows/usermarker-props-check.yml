name: UserMarker設計.mdとprops完全一致チェック

on:
  push:
    paths:
      - 'docs/UserMarker.md'
      - 'src/components/map/UserMarker.js'
  pull_request:
    paths:
      - 'docs/UserMarker.md'
      - 'src/components/map/UserMarker.js'

jobs:
  check-usermarker-props:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check UserMarker props一致
        run: |
          cd frontend
          npm install
          npm run check:usermarker
